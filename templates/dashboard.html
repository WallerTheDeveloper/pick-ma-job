{% extends "base.html" %}

{% block title %}Dashboard — pick-ma-job{% endblock %}

{% block head %}
<style>
  .page-wrap {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1rem 4rem;
  }

  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .page-header h1 { font-size: 1.5rem; font-weight: 700; }

  .nav-links { display: flex; gap: 1.25rem; }
  .nav-links a { font-size: 0.875rem; color: #6b7280; }

  .section {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }

  .section h2 {
    font-size: 0.875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6b7280;
    margin-bottom: 1rem;
  }

  /* Run widget */
  .run-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.625rem 1.5rem;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }

  .run-btn:hover { background: #1d4ed8; }
  .run-btn:disabled { background: #93c5fd; cursor: not-allowed; }

  .run-btn--secondary {
    background: #f3f4f6;
    color: #374151;
    margin-top: 0.75rem;
  }

  .run-btn--secondary:hover { background: #e5e7eb; }

  .run-badge {
    display: inline-block;
    padding: 0.3rem 0.75rem;
    border-radius: 99px;
    font-size: 0.8125rem;
    font-weight: 600;
    margin-bottom: 0.75rem;
  }

  .run-badge--pending  { background: #fef9c3; color: #854d0e; }
  .run-badge--running  { background: #dbeafe; color: #1e40af; }
  .run-badge--completed { background: #dcfce7; color: #166534; }
  .run-badge--failed   { background: #fee2e2; color: #991b1b; }

  .run-result { padding: 0.75rem 0; }
  .run-result--success { }
  .run-result--error { }

  .run-summary {
    font-size: 0.9375rem;
    color: #374151;
    margin-bottom: 0.5rem;
    line-height: 1.6;
  }

  .run-errors {
    font-size: 0.875rem;
    color: #b45309;
  }

  .run-error-msg {
    font-size: 0.875rem;
    color: #dc2626;
    margin-top: 0.25rem;
  }

  .run-again-form { margin-top: 0.5rem; }
</style>
{% endblock %}

{% block content %}
<div class="page-wrap">
  <div class="page-header">
    <h1>Dashboard</h1>
    <nav class="nav-links">
      <a href="/results">Results</a>
      <a href="/profile">Profile</a>
      <a href="/search-config">Search Config</a>
      <a href="/auth/logout">Logout</a>
    </nav>
  </div>

  <div class="section">
    <h2>Run Pipeline</h2>
    {% include "partials/run_button.html" %}
  </div>
</div>
{% endblock %}
